name: Release Windows
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Check release tag and application versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run version:check -- --tag "$env:RELEASE_TAG"
      - run: npm test
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run desktop:build -- --ci -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: orbital-${{ github.ref_name }}-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Create draft release and attach installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath src-tauri/target/release/bundle/nsis -Filter '*.exe')
          if ($installers.Count -eq 0) { throw 'No Windows installer was produced.' }
          $existing = gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'This release is already published. Create a new version instead of replacing its files.' }
          } else {
            gh release create "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --verify-tag --draft --title "Orbital $env:RELEASE_TAG" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release.' }
          }
          foreach ($installer in $installers) {
            gh release upload "$env:RELEASE_TAG" "$($installer.FullName)" --repo "$env:GITHUB_REPOSITORY" --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not upload the installer.' }
          }
