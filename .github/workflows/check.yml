name: Check desktop
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run version:check
      - run: npm test
      - run: npm run test:ui
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run desktop:build -- --ci --config src-tauri/tauri.ci.conf.json -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: orbital-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
